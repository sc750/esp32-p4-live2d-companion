## IDF Component Manager Manifest File
## 锁定 managed_components，防止从注册表重新下载覆盖旧版本
idf:
  version: ">=5.5.3"
  component_manager:
    lock_managed_components: true

dependencies:
  espressif/esp_wifi_remote:
    version: "1.6.2"

  espressif/esp_hosted:
    version: "3.0.2"

  esp_video:
    version: "2.0.*"
    public: true

  espressif/esp_lvgl_adapter:
    version: "0.5.*"
    public: true

  espressif/esp_lcd_lt8912b:
    version: ">=0.1.3,<1.0.0"

  lvgl/lvgl:
    version: "9.4.*"
    public: true
