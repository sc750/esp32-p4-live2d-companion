## IDF Component Manager Manifest File
## 对齐官方 esp_brookesia_phone 依赖链：BSP 用 noglib 变体（无图形库），
## LVGL 集成由 esp_lvgl_adapter 接管；不锁定 managed_components。
dependencies:
  idf: ">=5.5.3"
  # 板级支持包（官方 esp-bsp，无图形库变体，Kconfig 含完整显示菜单）
  espressif/esp32_p4_function_ev_board_noglib: "5.2.*"
  # Wi-Fi 远程化：esp_wifi API 透明接管，经 esp_hosted(SDIO) 驱动板载 ESP32-C6
  espressif/esp_wifi_remote: "1.6.2"
  espressif/esp_hosted: "3.0.2"
  # 摄像头：esp_video V4L2 框架（SC2336 MIPI-CSI）
  esp_video:
    version: "2.0.*"
    public: true
  # LVGL 适配器（esp-iot-solution，支持 lvgl 8~9）
  espressif/esp_lvgl_adapter:
    version: "0.5.*"
    public: true
  # UI 框架（PRD 要求 v9）
  lvgl/lvgl:
    version: "9.4.*"
    public: true
